[Paths]
; Relative paths are relative to the install directory (/home/flowerweb)
WebRoot=web
LogRoot=logs
ConfigRoot=config

[Server]
Name=Green House M.D.
Port=8080

[Relay]
Pin=18
; 0 = relay switches ON when the pin is HIGH, 1 = ON when LOW
ActiveLow=0
; 1 = test mode: never touch GPIO or reboot, only log what would happen
Simulate=0
; Valve opening time. Changed from the web page; always kept between 1000 and MaxPulseTimeMS
PulseTimeMS=5000
MaxPulseTimeMS=60000
; Automatic watering interval in hours, 0 = disabled. Changed from the web page.
TimerInterval=0
; Written by FlowerWeb so the schedule survives restarts
NextWatering=

[Camera]
Name=cam
Port=8889

[Logging]
; INFO or ERROR
Level=INFO
File=flowerweb.log
